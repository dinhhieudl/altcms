services:
  postgres:
    image: postgres:16-alpine
    container_name: altcms-db
    environment:
      POSTGRES_DB: altcms
      POSTGRES_USER: altcms
      POSTGRES_PASSWORD: altcms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altcms"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: altcms-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://altcms:altcms@postgres:5432/altcms
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    volumes:
      - uploads:/app/src/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: altcms-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
